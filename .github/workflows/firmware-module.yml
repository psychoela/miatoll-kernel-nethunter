name: firmware-module

on:
  workflow_dispatch:
    inputs:
      module_version:
        description: "Versi modul (contoh 1.0)"
        required: true
        default: "1.0"

jobs:
  pack:
    runs-on: ubuntu-22.04
    steps:
      - name: Ambil linux-firmware
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git fw \
            || git clone --depth=1 https://gitlab.com/kernel-firmware/linux-firmware.git fw
          git -C fw log -1 --format='linux-firmware commit: %h (%ci)'

      - name: Susun modul Magisk
        env:
          MVER: ${{ inputs.module_version }}
        run: |
          set -u
          if ! echo "$MVER" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "Versi tidak sah"; exit 1
          fi
          D=module/system/vendor/firmware
          mkdir -p "$D" module/META-INF/com/google/android

          # cp_fw <sumber (relatif fw/)> <nama di /vendor/firmware> [nama kedua]
          cp_fw() {
            src="fw/$1"
            if [ ! -f "$src" ]; then echo "TIADA: $1"; return 1; fi
            shift
            for dst in "$@"; do
              mkdir -p "$D/$(dirname "$dst")"
              cp "$src" "$D/$dst"
            done
          }

          echo "=== ath9k_htc (AR9271, AR7010) ==="
          cp_fw ath9k_htc/htc_9271-1.4.0.fw htc_9271.fw ath9k_htc/htc_9271-1.4.0.fw \
            || cp_fw htc_9271.fw htc_9271.fw || true
          cp_fw ath9k_htc/htc_7010-1.4.0.fw htc_7010.fw ath9k_htc/htc_7010-1.4.0.fw \
            || cp_fw htc_7010.fw htc_7010.fw || true

          echo "=== carl9170 ==="
          cp_fw carl9170-1.fw carl9170-1.fw || true

          echo "=== rt2800usb, rt73usb, rt2500usb ==="
          cp_fw rt2870.bin rt2870.bin || true
          cp_fw rt73.bin rt73.bin || true
          cp_fw rt2570.bin rt2570.bin || true

          echo "=== rtlwifi USB (RTL8188/8192CU) dan rtl8xxxu ==="
          for f in fw/rtlwifi/rtl8192cufw*.bin fw/rtlwifi/rtl8723aufw*.bin \
                   fw/rtlwifi/rtl8192eu_nic.bin fw/rtlwifi/rtl8723bu_nic.bin \
                   fw/rtlwifi/rtl8188eufw.bin; do
            [ -f "$f" ] && cp_fw "${f#fw/}" "${f#fw/}"
          done

          echo "=== zd1211rw ==="
          if [ -d fw/zd1211 ]; then
            mkdir -p "$D/zd1211" && cp fw/zd1211/zd1211* "$D/zd1211/"
          else
            echo "TIADA: zd1211/"
          fi

          echo "=== mt7601u ==="
          cp_fw mediatek/mt7601u.bin mt7601u.bin mediatek/mt7601u.bin \
            || cp_fw mt7601u.bin mt7601u.bin || true

          echo "=== Semak fail wajib ==="
          miss=0
          for need in htc_9271.fw carl9170-1.fw rt2870.bin rt73.bin rt2570.bin mt7601u.bin; do
            if [ ! -s "$D/$need" ]; then echo "WAJIB TIADA: $need"; miss=1; fi
          done
          ls "$D"/rtlwifi/rtl8192cufw*.bin > /dev/null 2>&1 || { echo "WAJIB TIADA: rtlwifi/rtl8192cufw*.bin"; miss=1; }
          ls "$D"/zd1211/zd1211* > /dev/null 2>&1 || { echo "WAJIB TIADA: zd1211/*"; miss=1; }
          [ "$miss" = 0 ] || exit 1

          cat > module/module.prop <<PROP
          id=usb-wifi-firmware
          name=USB WiFi Firmware (SigmaPhantom)
          version=v${MVER}
          versionCode=${GITHUB_RUN_NUMBER:-1}
          author=PsychoAvy
          description=Firmware untuk adapter WiFi USB: MT7601U, AR9271/AR7010 (ath9k_htc), AR9170 (carl9170), RT2800/RT73/RT2500, RTL8188/8192CU, ZD1211.
          PROP
          sed -i 's/^ *//' module/module.prop

          curl -fsSL https://raw.githubusercontent.com/topjohnwu/Magisk/master/scripts/module_installer.sh \
            -o module/META-INF/com/google/android/update-binary
          echo "#MAGISK" > module/META-INF/com/google/android/updater-script

          mkdir -p dist
          (cd module && zip -q -r -9 ../dist/usb-wifi-firmware-v${MVER}.zip . -x '.*')
          (cd "$D" && find . -type f -printf '%P  %s bait\n' | sort) > dist/senarai-firmware.txt
          echo "=== Isi modul ==="
          cat dist/senarai-firmware.txt
          ls -l dist

      - name: Muat naik modul
        uses: actions/upload-artifact@v4
        with:
          name: usb-wifi-firmware
          path: dist/
          if-no-files-found: error
