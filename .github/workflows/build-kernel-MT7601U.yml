name: build-sigma-357

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch untuk dibina"
        required: true
        default: "sigma-357"
      defconfig:
        description: "Defconfig (path relatif dari arch/arm64/configs)"
        required: true
        default: "vendor/xiaomi/miatoll_defconfig"
      kernel_name:
        description: "Nama kernel (huruf, nombor, titik, sempang sahaja)"
        required: true
        default: "SigmaPhantom"
      kernel_version:
        description: "Versi kernel (contoh r1.0)"
        required: true
        default: "r1.0"
      kernel_suffix:
        description: "Akhiran nama (lalai guna # lebar penuh; # biasa tidak dibenarkan)"
        required: true
        default: "＃NetHunter"
      build_number:
        description: "Nombor binaan selepas # dalam banner (contoh 1)"
        required: true
        default: "1"
      build_user:
        description: "Nama pembina dalam banner kernel (user@host)"
        required: true
        default: "PsychoAvy"
      build_host:
        description: "Nama host dalam banner kernel (user@host)"
        required: true
        default: "github"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Pasang kebergantungan
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip python3 git

      - name: Toolchain (Proton clang, sesuai untuk kernel 4.14)
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Build kernel
        env:
          KNAME: ${{ inputs.kernel_name }}
          KVER: ${{ inputs.kernel_version }}
          KSUFFIX: ${{ inputs.kernel_suffix }}
          BNUM: ${{ inputs.build_number }}
          BUSER: ${{ inputs.build_user }}
          BHOST: ${{ inputs.build_host }}
        run: |
          case "$KSUFFIX" in
            ""|*[\#\"\'\\\$\`\ ]*)
              echo "Akhiran tidak sah: jangan guna # biasa, petikan, \\, \$, backtick atau ruang"
              exit 1;;
          esac
          for v in "$KNAME" "$KVER" "$BNUM" "$BUSER" "$BHOST"; do
            if ! echo "$v" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "Aksara tidak dibenarkan dalam: $v (guna huruf, nombor, titik, sempang sahaja; tanpa #)"
              exit 1
            fi
          done
          export PATH=$HOME/clang/bin:$PATH
          export KBUILD_BUILD_USER="$BUSER"
          export KBUILD_BUILD_HOST="$BHOST"
          export KBUILD_BUILD_VERSION="$BNUM"
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $ARGS ${{ inputs.defconfig }}
          scripts/config --file out/.config -e MODULES -e MODULE_UNLOAD -d MODULE_SIG_FORCE -e MAC80211 -e WLAN_VENDOR_MEDIATEK -m MT7601U -d LLVM_POLLY
          scripts/config --file out/.config --set-str LOCALVERSION "-${KNAME}-${KVER}-${KSUFFIX}"
          make $ARGS olddefconfig
          echo "=== Diagnosis MT7601U ==="
          grep -n "MT7601U" out/.config || true
          sed -n '1,12p' drivers/net/wireless/mediatek/mt7601u/Kconfig
          grep -rn "select MT7601U\|imply MT7601U" --include='Kconfig*' . || echo "tiada select/imply"
          grep -rn "MT7601U" arch/arm64/configs/ || echo "tiada rujukan dalam defconfig"
          echo "=== Semakan config ==="
          grep -E "CONFIG_MODULES=|CONFIG_MODULE_UNLOAD=|CONFIG_MODULE_SIG_FORCE|CONFIG_CFG80211=|CONFIG_MAC80211=|CONFIG_WLAN_VENDOR_MEDIATEK=|CONFIG_MT7601U=|CONFIG_LOCALVERSION=" out/.config
          grep -q "CONFIG_MAC80211=y" out/.config
          grep -q "CONFIG_MODULES=y" out/.config
          grep -q "CONFIG_MODULE_UNLOAD=y" out/.config
          grep -q "CONFIG_MT7601U=m" out/.config
          for o in ATH9K_HTC CARL9170 RT2800USB RT2500USB RT73USB RTL8192CU RTL8187 ZD1211RW; do grep -E "^CONFIG_$o=" out/.config || echo "TIADA: $o"; done
          make -k -j$(nproc) $ARGS
          make -j$(nproc) $ARGS modules
          find out -name mt7601u.ko | grep -q . || { echo "mt7601u.ko tidak terhasil"; exit 1; }

      - name: Pack zip flash (AnyKernel3)
        env:
          KNAME: ${{ inputs.kernel_name }}
          KVER: ${{ inputs.kernel_version }}
          KSUFFIX: ${{ inputs.kernel_suffix }}
          BUSER: ${{ inputs.build_user }}
          BHOST: ${{ inputs.build_host }}
        run: |
          SUB=$(grep -E '^SUBLEVEL = ' Makefile | awk '{print $3}')
          NAME="${KNAME}-${KVER}-4_14_${SUB}-miatoll"
          echo "=== Semak nama dalam Image ==="
          grep -a -o -m1 "Linux version 4\.14\.[0-9]*-[A-Za-z0-9._-]*" out/arch/arm64/boot/Image
          grep -aq "${KNAME}-${KVER}-${KSUFFIX} (${BUSER}@${BHOST})" out/arch/arm64/boot/Image
          rm -rf ak && mkdir ak
          unzip -q anykernel-template.zip -d ak
          sed -i "s|^kernel.string=.*|kernel.string=${KNAME} ${KVER} by ${BUSER} (based on kinesis by clarencelol)|" ak/anykernel.sh
          grep '^kernel.string=' ak/anykernel.sh
          cp out/arch/arm64/boot/Image ak/Image
          cp out/arch/arm64/boot/dtb.img ak/dtb
          cp out/arch/arm64/boot/dtbo.img ak/dtbo.img
          mkdir -p dist
          (cd ak && zip -q -r -9 ../dist/$NAME.zip . -x '.*')
          cp out/.config dist/config.txt
          cp "$(find out -name mt7601u.ko | head -n1)" dist/mt7601u.ko
          modinfo dist/mt7601u.ko | grep -E "^(vermagic|depends)"
          ls -l dist

      - name: Muat naik hasil
        uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable
          path: dist/
          if-no-files-found: error

          
